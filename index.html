<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECA 2026 ICDC — Exam Practice Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f7f6f2;
    color: #1f1f1f;
    line-height: 1.6;
    padding: 20px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .container { max-width: 1000px; margin: 0 auto; padding: 10px 0 60px; }
  header {
    margin-bottom: 30px;
    text-align: left;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #185FA5;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  header p {
    color: #6b6b68;
    font-size: 15px;
    max-width: 600px;
    margin: 0;
  }
  .stats-overview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid #e5e3dc;
    border-radius: 12px;
    padding: 16px 8px;
    text-align: center;
  }
  .stat-card h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b6b68;
    margin-bottom: 4px;
  }
  .stat-card .value {
    font-size: 20px;
    font-weight: 600;
    color: #1f1f1f;
  }
  .exam-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .exam-card {
    background: #fff;
    border: 1px solid #e5e3dc;
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    color: inherit;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .exam-card:active {
    transform: scale(0.98);
    background: #f9f9f7;
  }
  .exam-card:hover {
    border-color: #185FA5;
    box-shadow: 0 8px 20px rgba(24, 95, 165, 0.08);
  }
  .exam-card h2 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .exam-card .meta {
    font-size: 13px;
    color: #6b6b68;
    margin-bottom: 16px;
    flex-grow: 1;
  }
  .score-pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 12px;
    align-self: flex-start;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: #185FA5;
    color: #fff;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }
  @media (max-width: 600px) {
    .stats-overview { grid-template-columns: 1fr 1fr 1fr; }
    .stat-card .value { font-size: 18px; }
    header h1 { font-size: 24px; }
  }

  .footer {
    margin-top: 60px;
    text-align: center;
    font-size: 13px;
    color: #a0a09d;
  }
  @media (max-width: 600px) {
    header h1 { font-size: 24px; }
    .exam-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
      <h1 style="margin-bottom:0">DECA MTDM Practice</h1>
      <a href="progress.html" style="display:inline-flex;align-items:center;gap:6px;background:#185FA5;color:#fff;text-decoration:none;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;">📊 My Progress</a>
    </div>
    <p>20 sets of 100 questions each, weighted by official ICDC blueprints to help you prepare for the Marketing Team Decision Making exam.</p>
  </header>

  <div class="stats-overview">
    <div class="stat-card">
      <h3>Total Questions</h3>
      <div class="value">2,000</div>
    </div>
    <div class="stat-card">
      <h3>Exam Sets</h3>
      <div class="value">20</div>
    </div>
    <div class="stat-card">
      <h3>Target Score</h3>
      <div class="value">85%+</div>
    </div>
  </div>

  <div class="exam-grid" id="exam-grid">
    <!-- Cards will be generated by JS -->
  </div>

  <div class="footer">
    &copy; 2026 DECA ICDC Preparation · Marketing Cluster
  </div>
</div>

<script>
  const totalSets = 20;
  const grid = document.getElementById('exam-grid');
  
  for (let i = 1; i <= totalSets; i++) {
    const card = document.createElement('a');
    card.href = `DECA_MTDM_ICDC_Exam_Set${i}.html`;
    card.className = 'exam-card';
    card.id = `exam-set-${i}`;
    
    // Check for saved score in localStorage
    const savedData = localStorage.getItem(`deca_exam_set_${i}`);
    let scoreHtml = '';
    if (savedData) {
      const data = JSON.parse(savedData);
      let pillStyle = 'background:#EAF3DE;color:#3B6D11;'; // Good
      if (data.pct < 85) pillStyle = 'background:#E6F1FB;color:#185FA5;'; // OK
      if (data.pct < 70) pillStyle = 'background:#FAEEDA;color:#854F0B;'; // Warn
      
      scoreHtml = `<div class="score-pill" style="display:block; ${pillStyle}">Best: ${data.pct}%</div>`;
    }

    card.innerHTML = `
      ${scoreHtml}
      <h2>Exam Set ${i}</h2>
      <div class="meta">100 questions · Marketing Cluster focus</div>
      <div class="btn">Start Exam →</div>
    `;
    grid.appendChild(card);
  }
</script>

</body>
</html>
